name: OilTrace CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test stack
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-test.txt
      - name: Compile check
        run: python -m compileall -q backend/app backend/tests ml/validation_metrics.py
      - name: Backend tests
        run: python backend/tests/run_all.py
      - name: Secret scan (placeholders only)
        run: |
          ! grep -RIn --exclude-dir=node_modules --exclude-dir=venv --exclude-dir=.venv --exclude='*.lock' \
            -e 'Sih_hanshbhai' -e '9072be22' -e 'hf3f3kd' -e 'asingh123456789' \
            .env.example backend/app frontend/src ml scripts 2>/dev/null
      - name: Dependency audit (informational)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-core.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Frontend audit (informational)
        continue-on-error: true
        run: npm audit --omit=dev || true
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oiltrace:ci .
