# One-command full-stack deployment: FastAPI + React (built inside the image) + PostGIS.
#
#   docker compose up --build
#
# Then open http://localhost:8000/app/  (Swagger at /docs).
# This is the fastest, most reliable path for a review environment — it needs
# nothing pre-installed except Docker, and it builds the production React
# bundle automatically as part of the image build (see Dockerfile).
#
# hot reload), use docker-compose.postgis.yml for just the database and
# run the backend/frontend directly.
services:
  postgis:
    image: postgis/postgis:16-3.5
    container_name: oiltrace-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: oiltrace
      POSTGRES_USER: oiltrace
      POSTGRES_PASSWORD: oiltrace
    volumes:
      - oiltrace_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oiltrace -d oiltrace"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: oiltrace-app
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://oiltrace:oiltrace@postgis:5432/oiltrace
      CORS_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173"
      PORT: 8000
      APP_MODE: development
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - oiltrace_data:/app/data
      - ./backend/app:/app/backend/app
      - ./frontend/dist:/app/frontend/dist

volumes:
  oiltrace_postgis:
  oiltrace_data:
